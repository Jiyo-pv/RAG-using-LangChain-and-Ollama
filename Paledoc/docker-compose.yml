services:
  db:
    image: postgres:16-alpine
    container_name: paledoc_db
    environment:
      POSTGRES_DB: paledoc_db
      POSTGRES_USER: paledoc_user
      POSTGRES_PASSWORD: paledoc_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paledoc_user -d paledoc_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: paledoc_web
    ports:
      - "8000:8000"
    volumes:
      - ./media:/app/media
      - ./chroma_data:/app/chroma_data
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=paledoc_db
      - DB_USER=paledoc_user
      - DB_PASSWORD=paledoc_password
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - DJANGO_SETTINGS_MODULE=config.settings
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  postgres_data:
