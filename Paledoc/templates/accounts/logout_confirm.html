{% extends "base.html" %}

{% block title %}Logout — Paledoc{% endblock %}
{% block page_title %}Logout{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-5">
        <div class="card border-0 shadow-sm text-center p-4">
            <div class="mb-3">
                <i class="bi bi-box-arrow-left fs-1 text-danger"></i>
            </div>
            <h5 class="fw-bold">Sign out of Paledoc?</h5>
            <p class="text-muted small mb-4">You will need to log in again to access your documents.</p>
            <form method="post" action="{% url 'accounts:logout' %}">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger me-2">
                    <i class="bi bi-box-arrow-left me-1"></i> Yes, Logout
                </button>
                <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
