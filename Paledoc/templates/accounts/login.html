<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — Paledoc</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        body {
            background: #0f172a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        .login-wrapper {
            width: 100%;
            max-width: 420px;
            padding: 1.5rem;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            margin-bottom: 2rem;
            text-decoration: none;
        }

        .brand-logo .icon {
            width: 44px;
            height: 44px;
            background: #3b82f6;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 1.3rem;
            font-weight: 800;
        }

        .brand-logo .name {
            font-size: 1.6rem;
            font-weight: 800;
            color: #fff;
            letter-spacing: 0.5px;
        }

        .login-card {
            background: #fff;
            border-radius: 16px;
            padding: 2.25rem 2rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }

        .login-card h2 {
            font-size: 1.3rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 0.25rem;
        }

        .login-card .subtitle {
            font-size: 0.875rem;
            color: #64748b;
            margin-bottom: 1.75rem;
        }

        .form-control {
            border-radius: 8px;
            border: 1.5px solid #e2e8f0;
            padding: 0.65rem 0.9rem;
            font-size: 0.9rem;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.1);
        }

        .btn-primary {
            background: #3b82f6;
            border: none;
            border-radius: 8px;
            padding: 0.7rem;
            font-weight: 600;
            font-size: 0.95rem;
            transition: background 0.2s;
        }

        .btn-primary:hover {
            background: #2563eb;
        }

        .footer-link {
            font-size: 0.85rem;
            color: #64748b;
            text-align: center;
            margin-top: 1.25rem;
        }

        .footer-link a {
            color: #3b82f6;
            text-decoration: none;
            font-weight: 500;
        }

        .footer-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="login-wrapper">
    <a href="/" class="brand-logo">
        <div class="icon">P</div>
        <span class="name">Paledoc</span>
    </a>

    <div class="login-card">
        <h2>Welcome back</h2>
        <p class="subtitle">Sign in to your Paledoc account</p>

        {% if error %}
        <div class="alert alert-danger d-flex align-items-center gap-2 py-2 px-3 mb-3" role="alert">
            <i class="bi bi-exclamation-circle-fill flex-shrink-0"></i>
            <div class="small">{{ error }}</div>
        </div>
        {% endif %}

        <form method="POST" novalidate>
            {% csrf_token %}

            <div class="mb-3">
                <label for="id_username" class="form-label fw-semibold small">Username</label>
                <input
                    type="text"
                    id="id_username"
                    name="username"
                    class="form-control"
                    placeholder="Enter your username"
                    value="{{ request.POST.username|default:'' }}"
                    required
                    autofocus
                >
            </div>

            <div class="mb-4">
                <label for="id_password" class="form-label fw-semibold small">Password</label>
                <input
                    type="password"
                    id="id_password"
                    name="password"
                    class="form-control"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary w-100">
                <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
            </button>
        </form>

        <p class="footer-link">
            Don't have an account? <a href="{% url 'accounts:register' %}">Create one</a>
        </p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
